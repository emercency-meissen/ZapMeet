<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZapMeet</title>
<style>
/* Body & Intro */
body { font-family: Arial; margin:0; padding:0; background:white; overflow:hidden; }
#intro { position:fixed; top:0; left:0; width:100%; height:100%; display:flex; flex-direction:column; justify-content:center; align-items:center; background:white; z-index:1000; }
#intro h1 { font-size:4rem; color:#ff5722; opacity:0; transition: opacity 2s ease-in-out; }
#intro p { font-size:1.5rem; color:#555; margin-top:20px; opacity:0; transition: opacity 1s ease-in-out; }
/* Main UI */
#mainUI { display:none; flex-direction: column; align-items:center; background:#f2f2f2; height:100vh; width:100vw; }
#videos { display:flex; justify-content:center; margin-top:20px; }
video { width:45%; margin:5px; border:2px solid #ff5722; border-radius:8px; }
#controls { margin-top:10px; }
button { margin:5px; padding:10px; border:none; border-radius:5px; cursor:pointer; background:#ff5722; color:white; }
button:hover { background:#e64a19; }
#chat { width:50%; margin-top:20px; }
#messages { border:1px solid #ccc; height:200px; overflow-y:auto; padding:5px; background:white; border-radius:4px; }
#messageInput { width:80%; padding:5px; border-radius:4px; border:1px solid #ccc; }
#sendBtn { width:18%; padding:5px; border-radius:4px; border:none; background:#ff5722; color:white; cursor:pointer; }
#loading { font-size:1.2rem; color:#333; margin-top:15px; opacity:0; transition: opacity 1s; }
</style>
</head>
<body>

<!-- Intro -->
<div id="intro">
<h1>ZapMeet</h1>
<p id="loading">Searching for a partner...</p>
</div>

<!-- Main UI -->
<div id="mainUI">
<div>
<label for="language">Sprache:</label>
<select id="language">
<option value="">Alle</option>
<option value="de">Deutsch</option>
<option value="en">Englisch</option>
<option value="es">Spanisch</option>
</select>
</div>

<div id="videos">
<video id="localVideo" autoplay muted></video>
<video id="remoteVideo" autoplay></video>
</div>

<div id="controls">
<button id="skipBtn">Skip</button>
<button id="reportBtn">Melden</button>
<button id="blockBtn">Blockieren</button>
</div>

<div id="chat">
<div id="messages"></div>
<input type="text" id="messageInput" placeholder="Nachricht eingeben...">
<button id="sendBtn">Senden</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
<script>
// Intro Animation + Pause
window.addEventListener('load', () => {
  const intro = document.getElementById('intro');
  const title = intro.querySelector('h1');
  const loading = document.getElementById('loading');
  const mainUI = document.getElementById('mainUI');

  // Fade-in Titel
  setTimeout(() => title.style.opacity = 1, 300);
  // Fade-in Loading
  setTimeout(() => loading.style.opacity = 1, 1500);

  // Nach 3,5 Sekunden Intro ausblenden und MainUI zeigen
  setTimeout(() => {
    intro.style.transition = 'opacity 1s ease';
    intro.style.opacity = 0;
    setTimeout(() => {
      intro.style.display = 'none';
      mainUI.style.display = 'flex';
      // Kamera + WebRTC startet jetzt in app.js
    }, 1000);
  }, 3500);
});
</script>
</body>
</html>
