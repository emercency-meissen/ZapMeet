<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZapMeet</title>
<style>
body { margin:0; padding:0; font-family: Arial; background:#f2f2f2; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; height:100vh; }

/* Startscreen */
#startScreen { display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; width:100vw; background:white; }
#startScreen h1 { font-size:4rem; color:#ff5722; margin:0; }
#startScreen p { font-size:1.5rem; color:#555; margin:10px 0 20px; }
#startBtn { padding:15px 30px; font-size:1.2rem; border:none; border-radius:6px; background:#ff5722; color:white; cursor:pointer; }
#startBtn:hover { background:#e64a19; }

/* Connect Overlay */
#connectOverlay { position:fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.95); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:2000; }
#connectOverlay h1 { font-size:3rem; color:#ff5722; margin:0; }
#connectOverlay p { font-size:1.2rem; color:#555; margin-top:10px; text-align:center; }
.spinner { border:8px solid #f3f3f3; border-top:8px solid #ff5722; border-radius:50%; width:60px; height:60px; animation:spin 1s linear infinite; margin:20px; }
@keyframes spin {0%{transform:rotate(0deg);}100%{transform:rotate(360deg);}}

/* Main UI */
#mainUI { display:none; flex-direction:column; align-items:center; width:100%; height:100%; }
#videos { display:flex; justify-content:center; margin-top:20px; }
video { width:45%; margin:5px; border:2px solid #ff5722; border-radius:8px; }
#controls { margin-top:10px; }
button { margin:5px; padding:10px; border:none; border-radius:5px; cursor:pointer; background:#ff5722; color:white; }
button:hover { background:#e64a19; }
#chat { width:50%; margin-top:20px; display:flex; flex-direction:column; }
#messages { border:1px solid #ccc; height:200px; overflow-y:auto; padding:5px; background:white; border-radius:4px; }
#messageInput { width:80%; padding:5px; border-radius:4px; border:1px solid #ccc; margin-top:5px; }
#sendBtn { width:18%; padding:5px; border-radius:4px; border:none; background:#ff5722; color:white; cursor:pointer; margin-top:5px; }
#language { margin-top:10px; padding:5px; border-radius:4px; border:1px solid #ccc; }
</style>
</head>
<body>

<!-- Startscreen -->
<div id="startScreen">
<h1>ZapMeet</h1>
<p>Wird gestartet...</p>
<button id="startBtn">Start</button>
</div>

<!-- Connect Overlay -->
<div id="connectOverlay">
<div class="spinner"></div>
<h1>ZapMeet</h1>
<p>Du wirst so schnell wie möglich verbunden</p>
</div>

<!-- Main UI -->
<div id="mainUI">
<div>
<label for="language">Sprache:</label>
<select id="language">
<option value="">Alle</option>
<option value="de">Deutsch</option>
<option value="en">Englisch</option>
<option value="es">Spanisch</option>
</select>
</div>

<div id="videos">
<video id="localVideo" autoplay muted></video>
<video id="remoteVideo" autoplay></video>
</div>

<div id="controls">
<button id="skipBtn">Skip</button>
<button id="reportBtn">Melden</button>
<button id="blockBtn">Blockieren</button>
</div>

<div id="chat">
<div id="messages"></div>
<input type="text" id="messageInput" placeholder="Nachricht eingeben...">
<button id="sendBtn">Senden</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
