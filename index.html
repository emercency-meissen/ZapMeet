<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>ZapMeet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- START OVERLAY -->
<div id="overlay">
  <h1>ZapMeet</h1>
  <p>Du wirst so schnell wie möglich verbunden</p>
  <div class="loader"></div>
</div>

<div id="app">

  <!-- VIDEOS -->
  <div id="videos">
    <!-- ANDERER (LINKS) -->
    <video id="remoteVideo" autoplay playsinline></video>

    <!-- DU (RECHTS) -->
    <video id="localVideo" autoplay muted playsinline></video>
  </div>

  <!-- UNTERER BEREICH -->
  <div id="bottom">
    <div id="controls">
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stopp</button>
    </div>

    <div id="chat">
      <div id="messages"></div>
      <input id="msg" placeholder="Nachricht schreiben">
    </div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
</body>
</html>
