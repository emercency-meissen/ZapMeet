<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZapMeet</title>
<style>
/* Body komplett weiß am Start */
body { 
  font-family: Arial; 
  margin: 0; 
  padding: 0; 
  background: white; 
  overflow: hidden;
}

/* Intro Container */
#intro {
  position: fixed;
  top:0; left:0;
  width:100%; height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  background:white;
  z-index: 1000;
}

/* ZapMeet Schrift */
#intro h1 {
  font-size: 4rem;
  color: #ff5722;
  opacity: 0; /* beginnt unsichtbar */
  transition: opacity 2s ease-in-out;
}

/* Haupt-UI */
#mainUI {
  display: none; /* zuerst versteckt */
  flex-direction: column;
  align-items: center;
  background: #f2f2f2;
  height: 100vh;
}
#videos { display:flex; justify-content:center; margin-top:20px;}
video { width:45%; margin:5px; border:2px solid #ff5722; border-radius:8px;}
#controls { margin-top:10px; }
button { margin:5px; padding:10px; border:none; border-radius:5px; cursor:pointer; background:#ff5722; color:white;}
button:hover { background:#e64a19;}
#chat { width:50%; margin-top:20px;}
#messages { border:1px solid #ccc; height:200px; overflow-y:auto; padding:5px; background:white; border-radius:4px;}
#messageInput { width:80%; padding:5px; border-radius:4px; border:1px solid #ccc;}
#sendBtn { width:18%; padding:5px; border-radius:4px; border:none; background:#ff5722; color:white; cursor:pointer;}
</style>
</head>
<body>

<!-- Intro -->
<div id="intro">
  <h1>ZapMeet</h1>
</div>

<!-- Haupt UI -->
<div id="mainUI">
<div>
<label for="language">Sprache:</label>
<select id="language">
<option value="">Alle</option>
<option value="de">Deutsch</option>
<option value="en">Englisch</option>
<option value="es">Spanisch</option>
</select>
</div>

<div id="videos">
<video id="localVideo" autoplay muted></video>
<video id="remoteVideo" autoplay></video>
</div>

<div id="controls">
<button id="skipBtn">Skip</button>
<button id="reportBtn">Melden</button>
<button id="blockBtn">Blockieren</button>
</div>

<div id="chat">
<div id="messages"></div>
<input type="text" id="messageInput" placeholder="Nachricht eingeben...">
<button id="sendBtn">Senden</button>
</div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>
<script>
// Intro Animation
window.addEventListener('load', () => {
  const introH1 = document.querySelector('#intro h1');
  const introDiv = document.getElementById('intro');
  const mainUI = document.getElementById('mainUI');

  // Schritt 1: Schrift langsam einblenden
  setTimeout(() => {
    introH1.style.opacity = 1;
  }, 500);

  // Schritt 2: Nach 2,5s Intro ausblenden, Haupt UI zeigen
  setTimeout(() => {
    introDiv.style.transition = 'opacity 1s ease';
    introDiv.style.opacity = 0;
    setTimeout(() => {
      introDiv.style.display = 'none';
      mainUI.style.display = 'flex';
      // Jetzt Kamera starten
      if(navigator.mediaDevices){
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
        .then(stream => {
          const localVideo = document.getElementById('localVideo');
          localVideo.srcObject = stream;
          window.localStream = stream; // global für app.js
        })
        .catch(err => console.error(err));
      }
    }, 1000);
  }, 2500);
});
</script>
</body>
</html>
